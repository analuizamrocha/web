name: E2E Smoke Tests (PR)

on:
  pull_request:

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:run

      - name: Lint
        run: bun run lint

      - name: Build production site
        run: bun run build

      - name: Check deployment negotiation headers
        run: node --test tests/build/agent-vary.mjs

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run production smoke and SEO regression tests
        env:
          CI: true
          PLAYWRIGHT_PRODUCTION: 'true'
        run: bun run e2e -- tests/e2e/smoke.spec.ts tests/e2e/agent-readiness.spec.ts tests/e2e/seo-recovery.spec.ts tests/e2e/patient-faqs.spec.ts tests/e2e/mobile-menu-layout.spec.ts tests/e2e/marketing-tracking.spec.ts

      - name: Build home hero tracking pilot mode
        env:
          WHATSAPP_HOME_TRACKING_URL: https://go.mdxstudio.com.br/c/test1234
        # A clean build keeps the default-mode output out of the pilot build.
        run: rm -rf .next && bun run build

      - name: Verify home hero tracking pilot mode
        env:
          CI: true
          PLAYWRIGHT_PRODUCTION: 'true'
          MARKETING_TEST_MODE: enabled
        run: bun run e2e -- tests/e2e/marketing-tracking.spec.ts

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-reports
          path: |
            reports/playwright/html
            reports/playwright/artifacts
          if-no-files-found: ignore
          retention-days: 7
