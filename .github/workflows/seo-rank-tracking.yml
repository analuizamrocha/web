name: SEO Rank Tracking

on:
  workflow_dispatch:
  schedule:
    # 06:15 America/Sao_Paulo (UTC-3), Mon/Wed/Fri
    - cron: '15 9 * * 1,3,5'

permissions:
  contents: write

jobs:
  update-rank-tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update rank tracking datasets
        env:
          TZ: America/Sao_Paulo
          GSC_SITE_URL: https://www.analuizarocha.com.br/
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          # 4 calls x 12-13 runs/month ~= 48-52 SerpAPI calls/month
          SERPAPI_MAX_CALLS_PER_RUN: '4'
          SERPAPI_NUM_RESULTS: '20'
          SERPAPI_LOCATION: Curitiba, Parana, Brazil
          SERPAPI_LANGUAGE: pt-br
          SERPAPI_COUNTRY: br
          RANK_DB_BACKEND: supabase
          RANK_DB_REQUIRED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run seo:rank:pipeline

      - name: Commit updated datasets
        run: |
          if git diff --quiet; then
            echo "No SEO tracking changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/serp-keywords-tracking-gsheets.csv \
            docs/serp-keywords-tracking-gsheets.tsv \
            docs/serp-keywords-history.csv \
            docs/serp-keywords-summary.csv
          if [ -f data/seo/serpapi-cursor.json ]; then
            git add data/seo/serpapi-cursor.json
          fi
          git commit -m "chore(seo): update rank tracking snapshots"
          git push
