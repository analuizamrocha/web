<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="V9 border dot prototype A">
  <circle cx="32" cy="32" r="29" fill="#5a3424" />

  <!-- Perfect circular border around the center dot -->
  <circle cx="32" cy="32" r="11.8" fill="none" stroke="#f5e8de" stroke-width="1.8" />

  <!-- Striped border on a concentric ring -->
  <circle
    cx="32"
    cy="32"
    r="14.6"
    fill="none"
    stroke="#f5e8de"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-dasharray="2.1 1.6"
    transform="rotate(-90 32 32)"
  />

  <circle cx="32" cy="32" r="4.2" fill="#f5e8de" />
</svg>
