<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V9 Dot Ring Prototypes</title>
    <style>
      :root {
        --bg: #e7e0d9;
        --card: #efe7df;
        --text: #5a3424;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1080px, calc(100% - 2rem));
        margin: 2rem auto 3rem;
      }

      h1 {
        margin: 0 0 0.35rem 0;
        font-size: 2rem;
      }

      p {
        margin: 0;
      }

      .grid {
        margin-top: 1.4rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1rem;
      }

      .card {
        background: var(--card);
        border: 1px solid #d8ccbf;
        border-radius: 16px;
        padding: 1rem;
      }

      .title {
        font-weight: 700;
        margin-bottom: 0.4rem;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 0.7rem;
      }

      .big {
        width: 120px;
        height: 120px;
      }

      .mid {
        width: 64px;
        height: 64px;
      }

      .tiny {
        width: 16px;
        height: 16px;
      }

      .tab {
        margin-top: 0.85rem;
        background: #242629;
        border: 1px solid #4b4d50;
        border-radius: 999px;
        padding: 0.6rem;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>V9 Circular Border Around Dot</h1>
      <p>Three focused variants. Same concept, different ring tuning.</p>

      <section class="grid">
        <article class="card">
          <div class="title">A: Solid ring + striped border</div>
          <div class="row">
            <img class="big" src="/favicons/clean-v9-border-dot-a.svg" alt="Prototype A" />
            <img class="mid" src="/favicons/clean-v9-border-dot-a.svg" alt="" />
            <img class="tiny" src="/favicons/clean-v9-border-dot-a.svg" alt="" />
          </div>
          <div class="tab">
            <img class="tiny" src="/favicons/clean-v9-border-dot-a.svg" alt="" />
          </div>
        </article>

        <article class="card">
          <div class="title">B: Single striped circular border</div>
          <div class="row">
            <img class="big" src="/favicons/clean-v9-border-dot-b.svg" alt="Prototype B" />
            <img class="mid" src="/favicons/clean-v9-border-dot-b.svg" alt="" />
            <img class="tiny" src="/favicons/clean-v9-border-dot-b.svg" alt="" />
          </div>
          <div class="tab">
            <img class="tiny" src="/favicons/clean-v9-border-dot-b.svg" alt="" />
          </div>
        </article>

        <article class="card">
          <div class="title">C: Denser ring closer to center</div>
          <div class="row">
            <img class="big" src="/favicons/clean-v9-border-dot-c.svg" alt="Prototype C" />
            <img class="mid" src="/favicons/clean-v9-border-dot-c.svg" alt="" />
            <img class="tiny" src="/favicons/clean-v9-border-dot-c.svg" alt="" />
          </div>
          <div class="tab">
            <img class="tiny" src="/favicons/clean-v9-border-dot-c.svg" alt="" />
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
